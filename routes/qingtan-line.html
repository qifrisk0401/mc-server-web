<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>青檀线 详情</title>
    <link rel="stylesheet" href="detail.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="back-bar">
            <a href="routes.html" class="back-btn">
                <span>←</span>
                <span>返回</span>
            </a>
        </div>
        <div class="profile-card">
            <div class="profile-avatar">
                <img src="logos/qingtanlinelogo.png" alt="Qingtan Line">
            </div>
            <div class="profile-info">
                <div class="profile-name">青檀线</div>
                <div class="profile-role role-admin">Qingtan Line</div>
                <div class="profile-bio">别称：祈州地铁3号线</div>
            </div>
        </div>
        <div class="info-section">
            <div class="section-title"><span>基本信息</span></div>
            <div class="info-grid">
                <div class="info-item"><span class="info-label">标志色</span><span class="info-value">FFA500（鏡音橙）</span></div>
                <div class="info-item"><span class="info-label">设计时速</span><span class="info-value">80km/h</span></div>
                <div class="info-item"><span class="info-label">线路长度</span><span class="info-value">暂无</span></div>
                <div class="info-item"><span class="info-label">开通时间</span><span class="info-value">暂无</span></div>
                <div class="info-item"><span class="info-label">发车间隔</span><span class="info-value">平峰8min/班,高峰(7:00-9:00,17:00-19:00)5min/班</span></div>
                <div class="info-item"><span class="info-label">车型</span><span class="info-value">NEO300型</span></div>
                <div class="info-item"><span class="info-label">编组</span><span class="info-value">6节</span></div>
                <div class="info-item"><span class="info-label">设计者</span><span class="info-value">friskkkkk</span></div>
            </div>
        </div>
        <div class="gallery-section">
            <div class="section-title"><span>图鉴</span></div>
            <div class="gallery-grid">
                <div class="gallery-item"><img src="images/qingtanline1.png" alt="图1"></div>
                <div class="gallery-item"><img src="images/qingtanline2.png" alt="图2"></div>
                <div class="gallery-item"><img src="images/qingtanline3.png" alt="图3"></div>
                <div class="gallery-item"><img src="images/qingtanline4.png" alt="图4"></div>
            </div>
        </div>
        <div class="page-footer">
            <p>  Qizhou Minecraft Server.Made by friskkkkk.</p>
        </div>
    </div>
</body>
</html>
